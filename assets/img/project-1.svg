<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ef"/>
      <stop offset="100%" stop-color="#eedfcb"/>
    </linearGradient>
    <linearGradient id="p1Card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#faf8f5"/>
    </linearGradient>
    <filter id="p1Shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#553a25" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" rx="16" fill="url(#p1Bg)"/>

  <!-- Browser Frame Mockup -->
  <g transform="translate(40, 30)" filter="url(#p1Shadow)">
    <!-- Browser Header Bar -->
    <rect width="520" height="320" rx="12" fill="#ffffff"/>
    <path d="M0 12 C0 5.37 5.37 0 12 0 L508 0 C514.63 0 520 5.37 520 12 L520 40 L0 40 Z" fill="#f0ebe3"/>
    
    <!-- Window Controls -->
    <circle cx="20" cy="20" r="5" fill="#f87171"/>
    <circle cx="36" cy="20" r="5" fill="#fbbf24"/>
    <circle cx="52" cy="20" r="5" fill="#34d399"/>
    
    <!-- Address Bar -->
    <rect x="80" y="10" width="360" height="20" rx="10" fill="#ffffff"/>
    <text x="100" y="24" font-family="system-ui, sans-serif" font-size="10" fill="#786e64">https://batik-kencana-umkm.id</text>

    <!-- Browser Body Content (Store Catalog UI) -->
    <!-- Hero Banner inside Mockup -->
    <rect x="25" y="55" width="470" height="90" rx="8" fill="#845233"/>
    <text x="45" y="90" font-family="system-ui, sans-serif" font-weight="700" font-size="16" fill="#ffffff">Koleksi Batik Tulis Nusantara</text>
    <text x="45" y="112" font-family="system-ui, sans-serif" font-size="11" fill="#dfcfbf">Katalog Produk Otentik dengan Pemesanan Langsung</text>
    <rect x="45" y="122" width="90" height="18" rx="4" fill="#c69c6d"/>
    <text x="55" y="135" font-family="system-ui, sans-serif" font-weight="600" font-size="9" fill="#ffffff">Belanja Sekarang</text>

    <!-- Product Grid Mockups (3 items) -->
    <!-- Card 1 -->
    <g transform="translate(25, 160)">
      <rect width="145" height="135" rx="6" fill="#fcfbf9" stroke="#e8ded2" stroke-width="1"/>
      <rect x="8" y="8" width="129" height="70" rx="4" fill="#eedfcb"/>
      <path d="M40 30 Q70 15 100 45 T130 55" stroke="#a3704c" stroke-width="3" fill="none"/>
      <text x="10" y="95" font-family="system-ui, sans-serif" font-weight="600" font-size="10" fill="#25201c">Kemeja Parang Klasik</text>
      <text x="10" y="110" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#845233">Rp 285.000</text>
      <rect x="95" y="100" width="40" height="18" rx="3" fill="#845233"/>
      <text x="102" y="112" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#ffffff">Beli</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(187, 160)">
      <rect width="145" height="135" rx="6" fill="#fcfbf9" stroke="#e8ded2" stroke-width="1"/>
      <rect x="8" y="8" width="129" height="70" rx="4" fill="#e2d4c3"/>
      <circle cx="72" cy="43" r="22" fill="#c69c6d" opacity="0.6"/>
      <text x="10" y="95" font-family="system-ui, sans-serif" font-weight="600" font-size="10" fill="#25201c">Batik Gamis Sogan</text>
      <text x="10" y="110" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#845233">Rp 340.000</text>
      <rect x="95" y="100" width="40" height="18" rx="3" fill="#845233"/>
      <text x="102" y="112" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#ffffff">Beli</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(350, 160)">
      <rect width="145" height="135" rx="6" fill="#fcfbf9" stroke="#e8ded2" stroke-width="1"/>
      <rect x="8" y="8" width="129" height="70" rx="4" fill="#dfcfbf"/>
      <path d="M20 50 L70 20 L120 50" stroke="#845233" stroke-width="2" fill="none"/>
      <text x="10" y="95" font-family="system-ui, sans-serif" font-weight="600" font-size="10" fill="#25201c">Selendang Sutra Mega</text>
      <text x="10" y="110" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#845233">Rp 195.000</text>
      <rect x="95" y="100" width="40" height="18" rx="3" fill="#845233"/>
      <text x="102" y="112" font-family="system-ui, sans-serif" font-size="8" font-weight="600" fill="#ffffff">Beli</text>
    </g>
  </g>
</svg>
