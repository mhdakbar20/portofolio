<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="50%" stop-color="#faf5ec"/>
      <stop offset="100%" stop-color="#f3e9d9"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#845233"/>
    </linearGradient>
    <filter id="sealShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#78350f" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="420" fill="url(#certBg)"/>

  <!-- Ornate Frame Border -->
  <rect x="20" y="20" width="560" height="380" rx="10" fill="none" stroke="url(#goldBorder)" stroke-width="4"/>
  <rect x="28" y="28" width="544" height="364" rx="6" fill="none" stroke="#d4b483" stroke-width="1.2" stroke-dasharray="6 4"/>
  
  <!-- Corner Ornaments -->
  <g fill="#845233">
    <circle cx="36" cy="36" r="4"/>
    <circle cx="564" cy="36" r="4"/>
    <circle cx="36" cy="384" r="4"/>
    <circle cx="564" cy="384" r="4"/>
  </g>

  <!-- Certificate Header -->
  <text x="300" y="75" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="4" fill="#845233">SERTIFIKAT PELATIHAN RESMI</text>
  <text x="300" y="105" text-anchor="middle" font-family="'Plus Jakarta Sans', Georgia, serif" font-size="24" font-weight="800" letter-spacing="1" fill="#25201c">CERTIFICATE OF PARTICIPATION</text>
  <line x1="220" y1="120" x2="380" y2="120" stroke="#c69c6d" stroke-width="2"/>

  <!-- Recipient Section -->
  <text x="300" y="155" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#786e64">Diberikan kepada:</text>
  <text x="300" y="195" text-anchor="middle" font-family="'Plus Jakarta Sans', Georgia, serif" font-size="26" font-weight="800" fill="#845233">Muhammad Akbar</text>
  <line x1="160" y1="210" x2="440" y2="210" stroke="#eedfcb" stroke-width="1.5"/>

  <!-- Training Title Placeholder -->
  <text x="300" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#5c534a">Atas partisipasi dan kelulusan kompetensi dalam program:</text>
  <text x="300" y="270" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#25201c">Program Pengembangan Kompetensi &amp; Pelatihan</text>
  <text x="300" y="295" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#786e64">Universitas Sriwijaya &bull; Terverifikasi</text>

  <!-- Gold Seal -->
  <g transform="translate(480, 310)" filter="url(#sealShadow)">
    <circle cx="35" cy="35" r="32" fill="url(#goldBorder)"/>
    <circle cx="35" cy="35" r="26" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 2"/>
    <path d="M35 15 L38 25 L48 26 L40 33 L43 43 L35 37 L27 43 L30 33 L22 26 L32 25 Z" fill="#ffffff"/>
  </g>

  <!-- Signatures Mockup -->
  <g transform="translate(80, 335)">
    <line x1="0" y1="35" x2="160" y2="35" stroke="#786e64" stroke-width="1"/>
    <path d="M20 25 Q45 5 70 30 T130 15" fill="none" stroke="#845233" stroke-width="2"/>
    <text x="80" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#5c534a">Ketua Penyelenggara</text>
  </g>

  <g transform="translate(280, 335)">
    <line x1="0" y1="35" x2="160" y2="35" stroke="#786e64" stroke-width="1"/>
    <path d="M20 28 Q50 10 80 25 T140 18" fill="none" stroke="#845233" stroke-width="2"/>
    <text x="80" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#5c534a">Instruktur / Pemateri</text>
  </g>
</svg>
