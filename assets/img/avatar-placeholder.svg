<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5ede4"/>
      <stop offset="50%" stop-color="#e8ded2"/>
      <stop offset="100%" stop-color="#dfcfbf"/>
    </linearGradient>
    <linearGradient id="brownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3704c"/>
      <stop offset="100%" stop-color="#845233"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c69c6d"/>
      <stop offset="100%" stop-color="#845233"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4a3525" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)"/>

  <!-- Decorative circles -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="6 8" opacity="0.6"/>
  <circle cx="200" cy="200" r="135" fill="#fdfbf9" filter="url(#softShadow)"/>

  <!-- Developer Silhouette / Character Avatar -->
  <!-- Shoulders & Coat -->
  <path d="M120 330 C120 270, 150 250, 200 250 C250 250, 280 270, 280 330 Z" fill="url(#brownGrad)"/>
  <!-- Inner shirt collar -->
  <path d="M180 250 L200 285 L220 250 Z" fill="#ffffff"/>
  <path d="M195 285 L200 330 L205 330 L205 285 Z" fill="#c69c6d"/>

  <!-- Neck -->
  <rect x="185" y="215" width="30" height="40" rx="6" fill="#eacbb2"/>

  <!-- Head -->
  <ellipse cx="200" cy="175" rx="48" ry="58" fill="#f3d8c3"/>

  <!-- Hair -->
  <path d="M152 165 C150 120, 180 112, 215 115 C245 118, 252 140, 248 175 C242 160, 230 152, 215 152 C185 152, 170 160, 152 165 Z" fill="#382920"/>
  <path d="M150 170 C146 185, 148 200, 152 205 C154 195, 153 180, 154 170 Z" fill="#382920"/>
  <path d="M250 170 C254 185, 252 200, 248 205 C246 195, 247 180, 246 170 Z" fill="#382920"/>

  <!-- Glasses (Modern Developer Look) -->
  <rect x="165" y="165" width="28" height="20" rx="5" fill="none" stroke="#25201c" stroke-width="3"/>
  <rect x="207" y="165" width="28" height="20" rx="5" fill="none" stroke="#25201c" stroke-width="3"/>
  <line x1="193" y1="173" x2="207" y2="173" stroke="#25201c" stroke-width="3"/>

  <!-- Smile -->
  <path d="M188 205 Q200 216 212 205" fill="none" stroke="#684229" stroke-width="3" stroke-linecap="round"/>

  <!-- Floating Badge: Code & Creator -->
  <g transform="translate(45, 60)">
    <rect width="110" height="34" rx="17" fill="#ffffff" filter="url(#softShadow)"/>
    <circle cx="18" cy="17" r="7" fill="#10b981"/>
    <text x="32" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#25201c">&lt;Dev /&gt;</text>
  </g>

  <g transform="translate(245, 305)">
    <rect width="115" height="34" rx="17" fill="#ffffff" filter="url(#softShadow)"/>
    <text x="16" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#845233">★ Kreatif</text>
  </g>
</svg>
