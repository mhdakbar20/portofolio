<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241e19"/>
      <stop offset="100%" stop-color="#181411"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfb58d"/>
      <stop offset="100%" stop-color="#845233"/>
    </linearGradient>
    <filter id="p3Shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="600" height="380" rx="16" fill="#f5ede4"/>

  <!-- Device / Screen Mockup -->
  <g transform="translate(40, 30)" filter="url(#p3Shadow)">
    <rect width="520" height="320" rx="12" fill="url(#p3Dark)"/>
    
    <!-- Top Bar -->
    <rect width="520" height="36" rx="12" fill="#1b1714"/>
    <circle cx="20" cy="18" r="5" fill="#f87171"/>
    <circle cx="36" cy="18" r="5" fill="#fbbf24"/>
    <circle cx="52" cy="18" r="5" fill="#34d399"/>
    
    <!-- Pill Nav inside dark mockup -->
    <rect x="180" y="8" width="160" height="20" rx="10" fill="#2d2621"/>
    <text x="205" y="22" font-family="system-ui, sans-serif" font-size="9" fill="#c69c6d">creator-studio.design</text>

    <!-- Hero area inside Creator Landing Page -->
    <g transform="translate(30, 55)">
      <!-- Gradient Orb -->
      <circle cx="360" cy="80" r="70" fill="url(#accentGlow)" opacity="0.25" filter="blur(20px)"/>
      
      <!-- Headline & Subtext -->
      <text x="0" y="28" font-family="system-ui, sans-serif" font-weight="800" font-size="18" fill="#ffffff">Amplify Your Digital Narrative</text>
      <text x="0" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#a89a8c">Platform Media Kit, Portofolio Video, & Kolaborasi Brand Eksklusif</text>

      <!-- CTA buttons -->
      <rect x="0" y="70" width="110" height="26" rx="13" fill="url(#accentGlow)"/>
      <text x="18" y="87" font-family="system-ui, sans-serif" font-weight="700" font-size="9" fill="#ffffff">Book Campaign</text>
      <rect x="120" y="70" width="85" height="26" rx="13" fill="#2d2621" stroke="#4a3e35" stroke-width="1"/>
      <text x="135" y="87" font-family="system-ui, sans-serif" font-weight="600" font-size="9" fill="#c69c6d">Rate Card</text>
    </g>

    <!-- 3 Content Showcase Cards -->
    <g transform="translate(30, 180)">
      <!-- Video Card 1 -->
      <rect width="145" height="110" rx="8" fill="#2d2621" stroke="#4a3e35" stroke-width="1"/>
      <rect x="8" y="8" width="129" height="60" rx="6" fill="#3a312a"/>
      <!-- Play Icon -->
      <circle cx="72" cy="38" r="14" fill="#c69c6d"/>
      <polygon points="70,33 78,38 70,43" fill="#1b1714"/>
      <text x="10" y="84" font-family="system-ui, sans-serif" font-weight="600" font-size="9" fill="#ffffff">Tech Review & Tutorial</text>
      <text x="10" y="98" font-family="system-ui, sans-serif" font-size="8" fill="#c69c6d">50K+ Views &bull; 9.4% Eng</text>

      <!-- Video Card 2 -->
      <g transform="translate(157, 0)">
        <rect width="145" height="110" rx="8" fill="#2d2621" stroke="#4a3e35" stroke-width="1"/>
        <rect x="8" y="8" width="129" height="60" rx="6" fill="#3a312a"/>
        <circle cx="72" cy="38" r="14" fill="#c69c6d"/>
        <polygon points="70,33 78,38 70,43" fill="#1b1714"/>
        <text x="10" y="84" font-family="system-ui, sans-serif" font-weight="600" font-size="9" fill="#ffffff">Design Sprint Showcase</text>
        <text x="10" y="98" font-family="system-ui, sans-serif" font-size="8" fill="#c69c6d">32K+ Views &bull; 11% Eng</text>
      </g>

      <!-- Metrics Card 3 -->
      <g transform="translate(314, 0)">
        <rect width="145" height="110" rx="8" fill="#2d2621" stroke="#4a3e35" stroke-width="1"/>
        <text x="12" y="24" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#dfb58d">Audience Reach</text>
        <text x="12" y="52" font-family="system-ui, sans-serif" font-weight="800" font-size="20" fill="#ffffff">120K+</text>
        <text x="12" y="70" font-family="system-ui, sans-serif" font-size="8" fill="#a89a8c">Total Monthly Impressions</text>
        <rect x="12" y="82" width="120" height="12" rx="6" fill="#3a312a"/>
        <rect x="12" y="82" width="95" height="12" rx="6" fill="url(#accentGlow)"/>
      </g>
    </g>
  </g>
</svg>
